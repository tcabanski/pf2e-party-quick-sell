name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - name: Syntax validation
        run: |
          for file in scripts/*.js tests/*.js; do node --check "$file"; done
          python -m py_compile tools/*.py
      - name: Validate tag and build
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/build.py
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          args=()
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/module.zip dist/module.json --repo "$REPOSITORY" --verify-tag --title "PF2e Party Quick Sell $RELEASE_TAG" --notes-file RELEASE_NOTES.md "${args[@]}"
      - name: Verify published assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/verify_release.py "$RELEASE_TAG"
